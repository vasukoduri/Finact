name: Release

# Publishes to PyPI when a GitHub Release is published.
# Uses PyPI trusted publishing (OIDC): no API tokens or passwords are stored in the repo.
# "Run workflow" (workflow_dispatch) publishes the current main branch, e.g. for a
# release that was created before this workflow existed.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip build twine packaging
          pip install -e ".[dev]"
      - name: Check the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          python - <<'PY'
          import os, sys, tomllib
          from packaging.version import Version
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if Version(tag) != Version(version):
              sys.exit(f"::error::Release tag {os.environ['GITHUB_REF_NAME']} does not match pyproject.toml version {version}")
          print(f"tag {tag} matches version {version}")
          PY
      - name: Test
        run: pytest
      - name: Build
        run: python -m build
      - name: Check package metadata
        run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/finact/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
